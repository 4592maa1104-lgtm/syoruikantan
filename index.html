<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>音声業務管理アプリ（プロトタイプ）</title>
<!-- Excelダウンロード機能でのみ使用する無料オープンソースライブラリ（SheetJS）。この読み込みのみ外部通信が発生する -->
<script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<!-- レシートのOCR（文字読み取り）機能でのみ使用する無料オープンソースライブラリ（Tesseract.js）。初回読み取り時に言語データ(数MB)を追加で取得する -->
<script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root {
    --bg: #f5f4f1;
    --surface: #ffffff;
    --text: #262320;
    --text-dim: #6b655d;
    --accent: #b5651d;
    --accent-dim: #e8ded2;
    --border: #e2ddd4;
    --danger: #b3372c;
    --ok: #3f7d4f;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a17;
      --surface: #262320;
      --text: #f0ece5;
      --text-dim: #a89f92;
      --accent: #e0965a;
      --accent-dim: #3a2f24;
      --border: #3a352e;
      --danger: #e07a6c;
      --ok: #7cc493;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
    display: flex;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    padding: 20px 18px 84px;
  }
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    display: flex; justify-content: center;
    background: var(--surface); border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .bottom-nav-item {
    flex: 1; max-width: 120px; display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: none; border: none; font-size: 10.5px; color: var(--text-dim); padding: 8px 0 6px; cursor: pointer;
  }
  .bottom-nav-item span:first-child { font-size: 20px; line-height: 1; }
  .bottom-nav-item.active { color: var(--accent); font-weight: 700; }
  .chat-bubble-user { text-align: right; margin-bottom: 10px; }
  .chat-bubble-user span {
    display: inline-block; background: var(--accent); color: #fff; padding: 9px 14px;
    border-radius: 14px 14px 2px 14px; max-width: 85%; font-size: 14px; text-align: left; white-space: pre-wrap;
  }
  .chat-bubble-assistant { margin-bottom: 14px; }
  .chat-bubble-assistant .bubble {
    display: inline-block; background: var(--surface); border: 1px solid var(--border); padding: 10px 14px;
    border-radius: 14px 14px 14px 2px; max-width: 92%; font-size: 14px; white-space: pre-wrap;
  }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  header .back { background: none; border: none; color: var(--accent); font-size: 17px; padding: 6px 4px; cursor: pointer; }
  h1 { font-size: 19px; margin: 0; }
  .subtitle { color: var(--text-dim); font-size: 13px; margin: -12px 0 20px; }
  .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; }
  .big-btn {
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 16px; font-size: 16px; font-weight: 700; color: var(--text); cursor: pointer; text-align: left;
  }
  .big-btn .icon { font-size: 26px; }
  .big-btn .desc { font-weight: 400; font-size: 12px; color: var(--text-dim); }
  textarea, input[type=text], input[type=number], input[type=date], select {
    width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; font-size: 15px; color: var(--text); font-family: inherit;
  }
  textarea { min-height: 110px; resize: vertical; }
  label { display: block; font-size: 12.5px; color: var(--text-dim); margin: 16px 0 6px; }
  .primary-btn {
    width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 10px;
    padding: 14px; font-size: 16px; font-weight: 700; margin-top: 22px; cursor: pointer;
  }
  .secondary-btn {
    width: 100%; background: var(--accent-dim); color: var(--accent); border: none; border-radius: 10px;
    padding: 13px; font-size: 15px; font-weight: 700; margin-top: 10px; cursor: pointer;
  }
  .ghost-btn {
    width: 100%; background: none; border: 1px solid var(--border); color: var(--text-dim); border-radius: 10px;
    padding: 12px; font-size: 14px; margin-top: 10px; cursor: pointer;
  }
  .mic-row { display: flex; gap: 8px; margin-top: 10px; }
  .mic-btn {
    flex: 0 0 auto; width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface); font-size: 22px; cursor: pointer;
  }
  .mic-btn.listening { background: var(--danger); border-color: var(--danger); color: #fff; }
  .mic-hint { font-size: 11.5px; color: var(--text-dim); margin-top: 6px; line-height: 1.6; }
  .field-row { margin-bottom: 2px; }
  .badge { display: inline-block; font-size: 11px; background: var(--accent-dim); color: var(--accent); padding: 3px 9px; border-radius: 999px; margin-bottom: 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; cursor: pointer; }
  .card .top-line { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
  .card .customer-project { font-size: 15.5px; font-weight: 700; }
  .card .content-preview { font-size: 13.5px; color: var(--text-dim); margin-top: 4px; white-space: pre-wrap; }
  .card .thumb-row { display: flex; align-items: center; gap: 12px; }
  .card img.thumb { width: 52px; height: 52px; object-fit: cover; border-radius: 8px; flex: 0 0 auto; }
  .empty-state { text-align: center; color: var(--text-dim); font-size: 14px; margin-top: 60px; line-height: 1.8; }
  .raw-ref { font-size: 12.5px; color: var(--text-dim); background: var(--accent-dim); border-radius: 10px; padding: 10px 12px; margin-top: 6px; white-space: pre-wrap; }
  .delete-link { display: block; text-align: center; color: var(--danger); font-size: 13px; margin-top: 16px; background: none; border: none; cursor: pointer; }
  .notice { font-size: 12px; color: var(--text-dim); line-height: 1.8; margin-top: 26px; border-top: 1px solid var(--border); padding-top: 14px; }
  .add-fab { display: block; width: 100%; text-align: center; background: var(--surface); border: 1px dashed var(--border); color: var(--accent); border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 700; margin-bottom: 16px; cursor: pointer; }
  .photo-frame { width: 100%; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); margin-bottom: 4px; background: var(--surface); }
  .photo-frame img { width: 100%; display: block; }
  .status-pill { display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 999px; background: var(--accent-dim); color: var(--accent); font-weight: 700; }
  .date-pair { display: flex; gap: 8px; }
  .date-pair input { flex: 1; }
  .item-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .item-card input { margin-top: 0; }
  .item-card .it-spec, .item-card .it-category-custom, .item-card select { margin-top: 6px; }
  .item-card .row-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .item-card .row-head span { font-size: 11px; color: var(--text-dim); }
  .item-card .rm { background: none; border: none; color: var(--danger); font-size: 16px; cursor: pointer; }
  .item-card .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 6px; }
  .item-card input { padding: 9px 8px; font-size: 13.5px; }
  .item-amount { text-align: right; font-size: 12px; color: var(--text-dim); margin-top: 4px; }
  .totals-box { margin-top: 14px; font-size: 14px; }
  .totals-box .line { display: flex; justify-content: space-between; padding: 4px 0; color: var(--text-dim); }
  .totals-box .line.total { color: var(--text); font-weight: 700; font-size: 17px; border-top: 1px solid var(--border); margin-top: 6px; padding-top: 10px; }

  /* ---- 帳票プレビュー（実際の請求書フォーマットに合わせたレイアウト） ---- */
  .doc-sheet { background: #fff; color: #1c1c1c; border: 1px solid #ccc; border-radius: 4px; padding: 18px 16px; font-size: 12px; }
  .doc-sheet .doc-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
  .doc-sheet .doc-title { font-size: 22px; font-weight: 800; color: #2f5d50; letter-spacing: 3px; margin: 0; }
  .doc-sheet .doc-meta { text-align: right; font-size: 11.5px; line-height: 1.7; }
  .doc-sheet .doc-meta b { font-size: 13px; }
  .doc-sheet .doc-parties { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; margin-bottom: 14px; border-bottom: 2px solid #2f5d50; padding-bottom: 10px; flex-wrap: wrap; }
  .doc-sheet .customer-name { font-size: 16px; font-weight: 700; border-bottom: 1px solid #999; padding-bottom: 4px; margin-bottom: 4px; }
  .doc-sheet .doc-company { text-align: right; font-size: 11px; line-height: 1.6; }
  .doc-sheet .doc-company .company-name { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
  .doc-sheet .doc-info-amount { display: flex; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .doc-sheet table.doc-info { flex: 1; min-width: 170px; border-collapse: collapse; font-size: 11.5px; height: fit-content; }
  .doc-sheet table.doc-info th { text-align: left; background: #eef1ef; padding: 6px 8px; width: 70px; font-weight: 600; border: 1px solid #ddd; }
  .doc-sheet table.doc-info td { padding: 6px 8px; border: 1px solid #ddd; }
  .doc-sheet .doc-amount-box { flex: 0 0 140px; background: #f2ead9; border: 2px solid #2f5d50; border-radius: 6px; text-align: center; padding: 10px 6px; display: flex; flex-direction: column; justify-content: center; }
  .doc-sheet .amount-label { font-size: 10.5px; color: #555; margin-bottom: 4px; }
  .doc-sheet .amount-value { font-size: 18px; font-weight: 800; color: #1c1c1c; }
  table.doc-items2 { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 10px; }
  table.doc-items2 th { background: #2f5d50; color: #fff; padding: 6px 4px; font-weight: 600; }
  table.doc-items2 td { padding: 5px 4px; border-bottom: 1px solid #ddd; }
  table.doc-items2 th:nth-child(3), table.doc-items2 td:nth-child(3),
  table.doc-items2 th:nth-child(5), table.doc-items2 td:nth-child(5),
  table.doc-items2 th:nth-child(6), table.doc-items2 td:nth-child(6) { text-align: right; }
  table.doc-totals2 { margin-left: auto; width: 220px; border-collapse: collapse; margin-bottom: 14px; }
  table.doc-totals2 td { padding: 5px 8px; font-size: 12px; }
  table.doc-totals2 td:last-child { text-align: right; }
  table.doc-totals2 tr.total td { font-weight: 800; font-size: 15px; background: #eef1ef; }
  .doc-footer2 { display: flex; gap: 14px; font-size: 11px; flex-wrap: wrap; }
  .doc-footer2 > div { flex: 1; min-width: 150px; line-height: 1.7; }
  .footer-label2 { font-weight: 700; margin-bottom: 4px; border-bottom: 1px solid #999; padding-bottom: 2px; }

  @media print {
    .no-print { display: none !important; }
    body, #app { max-width: none; padding: 0; margin: 0; background: #fff; color: #000; }
    .doc-sheet { border: none; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  "use strict";

  var KEYS = {
    captures: "captures_v1", receipts: "receipts_v1", quotes: "quotes_v1", invoices: "invoices_v1",
    paymentReceipts: "payment_receipts_v1", company: "company_profile_v1",
    customers: "customers_v1", projects: "projects_v1", changeOrders: "change_orders_v1", itemPresets: "item_presets_v1",
    payments: "payments_v1", photos: "photos_v1", scheduleEvents: "schedule_events_v1"
  };

  function loadList(key) {
    try { return JSON.parse(localStorage.getItem(key)) || []; } catch (e) { return []; }
  }
  function saveList(key, list) {
    try {
      localStorage.setItem(key, JSON.stringify(list));
      return true;
    } catch (e) {
      alert("保存に失敗しました。端末のストレージ容量が不足している可能性があります（写真付きのレシートが多いと発生しやすいです）。不要なレシートを削除してから、もう一度お試しください。");
      return false;
    }
  }
  function newId(prefix) { return prefix + "_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8); }
  function todayStr() { return new Date().toISOString().slice(0, 10); }
  function addDays(dateStr, n) { var d = dateStr ? new Date(dateStr) : new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
  function yen(n) { return "¥" + (Math.round(n) || 0).toLocaleString("ja-JP"); }
  function esc(v) { return (v == null ? "" : String(v)).replace(/"/g, "&quot;"); }

  var DEFAULT_COMPANY = { name: "", zip: "", address: "", tel: "", fax: "", invoiceRegNo: "", bankName: "", bankBranch: "", accountType: "普通", accountNumber: "", accountHolder: "" };

  // いただいた請求書サンプルの項目から作成した初期候補（⚙️自社情報の画面から追加・削除できる）
  var DEFAULT_ITEM_PRESETS = [
    { category: "仮設工事", spec: "養生・仮設足場一式", unit: "式" },
    { category: "解体工事", spec: "既存内装・設備解体、廃材搬出", unit: "式" },
    { category: "木工事", spec: "床下地・造作材工事", unit: "式" },
    { category: "内装工事", spec: "クロス・フローリング張替", unit: "㎡" },
    { category: "建具工事", spec: "室内建具・収納扉交換", unit: "箇所" },
    { category: "電気設備工事", spec: "配線・照明器具・スイッチ交換", unit: "式" },
    { category: "給排水衛生設備工事", spec: "キッチン・洗面・トイレ設備交換", unit: "式" },
    { category: "産業廃棄物処分費", spec: "解体廃材処分", unit: "式" },
    { category: "諸経費", spec: "現場管理費・運搬費", unit: "式" }
  ];
  function loadItemPresets() {
    var raw = localStorage.getItem(KEYS.itemPresets);
    if (raw === null) {
      var seeded = DEFAULT_ITEM_PRESETS.map(function (p) { return Object.assign({ id: newId("ip") }, p); });
      saveList(KEYS.itemPresets, seeded);
      return seeded;
    }
    try { return JSON.parse(raw) || []; } catch (e) { return []; }
  }
  function saveItemPresets(list) { return saveList(KEYS.itemPresets, list); }
  function matchPreset(categoryName) {
    return loadItemPresets().filter(function (p) { return p.category === categoryName; })[0];
  }

  // ---- 顧客・案件 ----
  function loadCustomers() { return loadList(KEYS.customers); }
  function saveCustomers(list) { return saveList(KEYS.customers, list); }
  function loadProjects() { return loadList(KEYS.projects); }
  function saveProjects(list) { return saveList(KEYS.projects, list); }
  function findCustomer(id) { return loadCustomers().find(function (c) { return c.id === id; }); }
  function findProject(id) { return loadProjects().find(function (p) { return p.id === id; }); }
  var PROJECT_STAGES = ["見積前", "見積中", "受注", "工事中", "完了"];

  // 顧客名の完全一致があれば再利用し、なければ新規作成した上で、案件を新規作成する
  function createOrReuseCustomerAndProject(input) {
    var customers = loadCustomers();
    var name = (input.customerName || "").trim();
    var customer = customers.find(function (c) { return c.name === name; });
    if (!customer && name) {
      customer = { id: newId("cust"), name: name, address: input.customerAddress || "", tel: input.customerTel || "", contactPerson: "", createdAt: new Date().toISOString() };
      customers.push(customer);
      saveCustomers(customers);
    }
    var projects = loadProjects();
    var project = {
      id: newId("proj"), customerId: customer ? customer.id : null, name: (input.projectName || "").trim(),
      workLocation: input.workLocation || "", periodStart: input.periodStart || "", periodEnd: input.periodEnd || "",
      stage: "見積前", createdAt: new Date().toISOString()
    };
    projects.push(project);
    saveProjects(projects);
    return project;
  }
  function projectSelectionInfo(projectId) {
    var project = findProject(projectId);
    if (!project) return null;
    var customer = project.customerId ? findCustomer(project.customerId) : null;
    return {
      projectId: project.id, customerName: customer ? customer.name : "", projectName: project.name,
      workLocation: project.workLocation, periodStart: project.periodStart, periodEnd: project.periodEnd
    };
  }

  // ---- 追加工事 ----
  function loadChangeOrders() { return loadList(KEYS.changeOrders); }
  function saveChangeOrders(list) { return saveList(KEYS.changeOrders, list); }
  function unbilledChangeOrders(projectId) {
    return loadChangeOrders().filter(function (c) { return c.projectId === projectId && !c.billed; });
  }
  function markChangeOrdersBilled(ids, invoiceId) {
    var list = loadChangeOrders();
    list.forEach(function (c) { if (ids.indexOf(c.id) !== -1) { c.billed = true; c.invoiceId = invoiceId; } });
    saveChangeOrders(list);
  }

  // ---- 追加見積書（既存の見積書と同じデータ構造。parentQuoteId/approvalStatusで区別する） ----
  function unbilledApprovedAdditionalQuotes(projectId) {
    return loadList(KEYS.quotes).filter(function (q) {
      return q.projectId === projectId && q.parentQuoteId && q.approvalStatus === "approved" && !q.billed;
    });
  }
  function markAdditionalQuotesBilled(ids, invoiceId) {
    var list = loadList(KEYS.quotes);
    list.forEach(function (q) { if (ids.indexOf(q.id) !== -1) { q.billed = true; q.invoiceId = invoiceId; } });
    saveList(KEYS.quotes, list);
  }
  function setQuoteApprovalStatus(quoteId, status) {
    var list = loadList(KEYS.quotes);
    var q = list.find(function (x) { return x.id === quoteId; });
    if (q) { q.approvalStatus = status; saveList(KEYS.quotes, list); }
    return q;
  }

  // 案件未設定の書類に、後から案件を割り当てる（見積/請求/領収書/経費/メモで共通利用）
  function assignProjectToRecord(key, id, sel) {
    var list = loadList(key);
    var rec = list.find(function (x) { return x.id === id; });
    if (!rec) return;
    rec.projectId = sel.projectId;
    saveList(key, list);
  }

  // ============================================================
  // 業務ロジック層
  // 画面（イベントハンドラ）からも、将来のAI（構造化コマンド）からも
  // 同じ関数を呼び出せるようにする。ここから下の関数はDOMに一切触れない。
  // 例）将来: {type:"create_change_order", projectId, description, amount}
  //     → createChangeOrder(projectId, description, amount) をそのまま呼ぶだけでよい
  // ============================================================

  function updateProjectStage(projectId, stage) {
    var projects = loadProjects();
    var p = projects.find(function (x) { return x.id === projectId; });
    if (p) { p.stage = stage; saveProjects(projects); }
    return p;
  }

  function createChangeOrder(projectId, description, amount) {
    var list = loadChangeOrders();
    var rec = { id: newId("co"), projectId: projectId, description: description, amount: Number(amount) || 0, billed: false, invoiceId: null, createdAt: new Date().toISOString() };
    list.push(rec);
    saveChangeOrders(list);
    return rec;
  }

  function createDocumentRecord(f) {
    var key = KEYS[DOC_KEY_BY_KIND[f.kind]];
    var list = loadList(key);
    var id = newId(f.kind);
    var record;
    if (f.kind === "receipt") {
      record = {
        id: id, kind: "receipt", docNumber: f.docNumber, issueDate: f.issueDate,
        customerName: f.customerName, project: f.project, projectId: f.projectId || null, amountReceived: f.amountReceived,
        description: f.description, invoiceId: f.fromInvoiceId || null,
        createdAt: new Date().toISOString()
      };
    } else {
      record = {
        id: id, kind: f.kind, docNumber: f.docNumber, issueDate: f.issueDate,
        customerName: f.customerName, project: f.project, projectId: f.projectId || null, workLocation: f.workLocation,
        periodStart: f.periodStart, periodEnd: f.periodEnd, dueDate: f.dueDate, dueDateNote: f.dueDateNote,
        items: f.items, remarks: f.remarks, paymentTerms: f.paymentTerms || "", quoteId: f.fromQuoteId || null,
        createdAt: new Date().toISOString()
      };
      if (f.kind === "invoice") {
        record.paymentStatus = "未入金";
        record.paidDate = null;
        record.changeOrderIds = f.selectedChangeOrderIds || [];
        record.additionalQuoteIds = f.selectedAdditionalQuoteIds || [];
      }
      if (f.kind === "quote" && f.parentQuoteId) {
        record.parentQuoteId = f.parentQuoteId;
        record.approvalStatus = f.approvalStatus || "pending";
        record.billed = false;
        record.invoiceId = null;
      }
    }
    list.push(record);
    saveList(key, list);
    if (f.kind === "invoice" && record.changeOrderIds && record.changeOrderIds.length) markChangeOrdersBilled(record.changeOrderIds, id);
    if (f.kind === "invoice" && record.additionalQuoteIds && record.additionalQuoteIds.length) markAdditionalQuotesBilled(record.additionalQuoteIds, id);
    return record;
  }

  function createCaptureRecord(rawText, structured, confirmed) {
    var list = loadList(KEYS.captures);
    var rec = { id: newId("c"), rawText: rawText, structured: structured, confirmed: confirmed, projectId: confirmed.projectId || null, status: "confirmed", createdAt: new Date().toISOString() };
    list.push(rec);
    saveList(KEYS.captures, list);
    return rec;
  }

  function createExpenseRecord(data) {
    var list = loadList(KEYS.receipts);
    var rec = {
      id: newId("r"), imageDataUrl: data.imageDataUrl, store: data.store, amount: data.amount,
      date: data.date, project: data.project, projectId: data.projectId || null, category: data.category,
      createdAt: new Date().toISOString()
    };
    list.push(rec);
    saveList(KEYS.receipts, list);
    return rec;
  }

  // ---- 入金（払い戻し不可の削除ではなく、記録の追加・取消で管理。分割入金に対応） ----
  function loadPayments() { return loadList(KEYS.payments); }
  function savePayments(list) { return saveList(KEYS.payments, list); }
  function paymentsForInvoice(invoiceId) { return loadPayments().filter(function (p) { return p.invoiceId === invoiceId; }); }
  function recordPayment(invoiceId, amount, date, note) {
    var list = loadPayments();
    var rec = { id: newId("pay"), invoiceId: invoiceId, amount: Number(amount) || 0, date: date || todayStr(), note: note || "", createdAt: new Date().toISOString() };
    list.push(rec);
    savePayments(list);
    return rec;
  }
  function deletePayment(paymentId) { savePayments(loadPayments().filter(function (p) { return p.id !== paymentId; })); }
  // 請求金額に対する入金状況をまとめる。旧バージョンで記録された簡易ステータス(paymentStatus)しかない請求書とも互換
  function getInvoicePaymentInfo(invoiceId, total) {
    var list = paymentsForInvoice(invoiceId);
    var paid = list.reduce(function (sum, p) { return sum + (Number(p.amount) || 0); }, 0);
    if (list.length === 0) {
      var found = findDoc(invoiceId);
      if (found && found.doc.paymentStatus === "入金済み") {
        return { paidAmount: total, remaining: 0, status: "入金済み", payments: [], legacy: true };
      }
    }
    var remaining = Math.max(0, total - paid);
    var status = paid === 0 ? "未入金" : (remaining === 0 ? "入金済み" : "一部入金");
    return { paidAmount: paid, remaining: remaining, status: status, payments: list, legacy: false };
  }

  // ---- 現場写真 ----
  var PHOTO_PHASES = ["着工前", "施工中", "完了", "追加工事"];
  function loadPhotos() { return loadList(KEYS.photos); }
  function savePhotos(list) { return saveList(KEYS.photos, list); }
  function createPhotoRecord(projectId, imageDataUrl, phase, caption) {

    var rec = { id: newId("photo"), projectId: projectId, imageDataUrl: imageDataUrl, phase: phase, caption: caption || "", createdAt: new Date().toISOString() };
    list.push(rec);
    savePhotos(list);
    return rec;
  }
  function deletePhoto(photoId) { savePhotos(loadPhotos().filter(function (p) { return p.id !== photoId; })); }

  // ---- スケジュール（予定） ----
  function loadScheduleEvents() { return loadList(KEYS.scheduleEvents); }
  function saveScheduleEvents(list) { return saveList(KEYS.scheduleEvents, list); }
  function createScheduleEvent(projectId, title, date, startTime, attendees) {
    var list = loadScheduleEvents();
    var rec = { id: newId("sched"), projectId: projectId, title: title, date: date, startTime: startTime || "", attendees: attendees || "", createdAt: new Date().toISOString() };
    list.push(rec);
    saveScheduleEvents(list);
    return rec;
  }
  function deleteScheduleEvent(id) { saveScheduleEvents(loadScheduleEvents().filter(function (s) { return s.id !== id; })); }
  function todaysScheduleEvents() {
    var today = todayStr();
    return loadScheduleEvents().filter(function (s) { return s.date === today; })
      .sort(function (a, b) { return (a.startTime || "").localeCompare(b.startTime || ""); });
  }

  // ============================================================
  // Query層（読み取り専用。チャット・将来のAIから利用する問い合わせ関数）
  // すべて既存のデータ操作層（loadX系）を呼ぶだけで、新しいデータは持たない。
  // ============================================================
  function getCustomers() { return loadCustomers(); }
  function getProjects() { return loadProjects(); }
  function getProjectById(projectId) { return findProject(projectId); }
  function getSchedulesByDate(dateStr) {
    return loadScheduleEvents().filter(function (s) { return s.date === dateStr; })
      .sort(function (a, b) { return (a.startTime || "").localeCompare(b.startTime || ""); });
  }
  function getTomorrowSchedules() { return getSchedulesByDate(addDays(todayStr(), 1)); }
  function getQuotesByProject(projectId) { return loadList(KEYS.quotes).filter(function (d) { return d.projectId === projectId; }); }
  function getInvoicesByProject(projectId) { return loadList(KEYS.invoices).filter(function (d) { return d.projectId === projectId; }); }
  function getPaymentReceiptsByProject(projectId) { return loadList(KEYS.paymentReceipts).filter(function (d) { return d.projectId === projectId; }); }
  function getExpensesByProject(projectId) { return loadList(KEYS.receipts).filter(function (d) { return d.projectId === projectId; }); }
  function getPhotosByProject(projectId) { return loadPhotos().filter(function (p) { return p.projectId === projectId; }); }
  function getPaymentsByProject(projectId) {
    var invoiceIds = getInvoicesByProject(projectId).map(function (i) { return i.id; });
    return loadPayments().filter(function (p) { return invoiceIds.indexOf(p.invoiceId) !== -1; });
  }
  // 見積はあるがまだ一件も請求書が作られていない案件
  function getUnbilledProjects() {
    return getProjects().filter(function (p) {
      return getQuotesByProject(p.id).length > 0 && getInvoicesByProject(p.id).length === 0;
    });
  }
  // 入金が完了していない請求書（未入金・一部入金）
  function getUnpaidInvoices() {
    return loadList(KEYS.invoices).filter(function (inv) {
      var total = calcTotals(inv.items).total;
      return getInvoicePaymentInfo(inv.id, total).status !== "入金済み";
    });
  }
  function getMonthlyInvoicedTotal(yearMonth) {
    return loadList(KEYS.invoices).filter(function (inv) { return (inv.issueDate || "").slice(0, 7) === yearMonth; })
      .reduce(function (sum, inv) { return sum + calcTotals(inv.items).total; }, 0);
  }
  function getMonthlyPaidTotal(yearMonth) {
    return loadPayments().filter(function (p) { return (p.date || "").slice(0, 7) === yearMonth; })
      .reduce(function (sum, p) { return sum + (Number(p.amount) || 0); }, 0);
  }
  // 本文中に登録済みの案件名・顧客名が含まれていないか検索する（あいまい一致の代わりに実データと突き合わせる）
  // 「顧客・案件」として正式登録されていない案件名も、メモ・見積・請求の自由テキストから拾う
  function findFreeTextProjectMatches(text) {
    var names = {};
    loadList(KEYS.captures).forEach(function (c) {
      var p = c.confirmed && c.confirmed.project;
      if (p && text.indexOf(p) !== -1) names[p] = true;
    });
    [KEYS.quotes, KEYS.invoices].forEach(function (key) {
      loadList(key).forEach(function (d) { if (d.project && text.indexOf(d.project) !== -1) names[d.project] = true; });
    });
    return Object.keys(names);
  }
  function buildFreeTextProjectSummary(name) {
    var memos = loadList(KEYS.captures).filter(function (c) { return c.confirmed && c.confirmed.project === name; });
    var quotes = loadList(KEYS.quotes).filter(function (d) { return d.project === name; });
    var invoices = loadList(KEYS.invoices).filter(function (d) { return d.project === name; });
    return {
      name: name, memos: memos, quotes: quotes, invoices: invoices,
      quoteTotal: quotes.reduce(function (sum, q) { return sum + calcTotals(q.items).total; }, 0),
      invoiceTotal: invoices.reduce(function (sum, i) { return sum + calcTotals(i.items).total; }, 0)
    };
  }

  // ============================================================
  // Phase 1 Chat Architecture: Layer 1-4
  // ============================================================
  
  // ---- Layer 1: 質問解析層（ルールベース）----
  // 入力: 自由形式の質問テキスト
  // 出力: 構造化されたSearchIntent配列
  
  function extractDateRange(question) {
    // 相対日付を ISO 日付に変換
    if (/(今日|きょう)/.test(question)) {
      return { from: todayStr(), to: todayStr() };
    }
    if (/明日|あした/.test(question)) {
      return { from: addDays(todayStr(), 1), to: addDays(todayStr(), 1) };
    }
    if (/今週|こんしゅう/.test(question)) {
      var today = new Date(todayStr());
      var dayOfWeek = today.getDay();
      var weekStart = addDays(todayStr(), -dayOfWeek);
      var weekEnd = addDays(weekStart, 6);
      return { from: weekStart, to: weekEnd };
    }
    if (/先週|せんしゅう/.test(question)) {
      var today2 = new Date(todayStr());
      var dayOfWeek2 = today2.getDay();
      var weekStart2 = addDays(todayStr(), -dayOfWeek2 - 7);
      var weekEnd2 = addDays(weekStart2, 6);
      return { from: weekStart2, to: weekEnd2 };
    }
    if (/今月|こんげつ/.test(question)) {
      var month = todayStr().slice(0, 7);
      var start = month + "-01";
      var end = addDays(start, 31);
      end = end.slice(0, 7) === month ? end : addDays(month + "-01", -1);
      return { from: start, to: end };
    }
    if (/先月|せんげつ/.test(question)) {
      var month2 = addDays(todayStr(), -30).slice(0, 7);
      var start2 = month2 + "-01";
      var end2 = addDays(start2, 31);
      end2 = end2.slice(0, 7) === month2 ? end2 : addDays(month2 + "-01", -1);
      return { from: start2, to: end2 };
    }
    // 「8月13日」「8/13」パターン
    var dateMatch = question.match(/(\d{1,4})年?(\d{1,2})月(\d{1,2})日?/);
    if (dateMatch) {
      var d = monthDayToIso(dateMatch[0]);
      return { from: d, to: d };
    }
    return { from: null, to: null };
  }

  function extractProjectName(question) {
    // 「同じ意味でも言い回しが違う質問」を一つの検索ロジックで処理するため、
    // 顧客名・案件名・自由テキストを統一的に抽出する。
    var projects = getProjects();
    for (var i = 0; i < projects.length; i++) {
      if (question.indexOf(projects[i].name) !== -1) {
        return { id: projects[i].id, name: projects[i].name };
      }
    }
    var customer = extractCustomerName(question);
    if (customer) {
      // 顧客が1案件だけならその案件として扱う。複数ある場合はここでは決めず、
      // customerId側（interpretQuestionのcustomer_projects分岐）に処理させる。
      var customerProjects = getProjects().filter(function (p) { return p.customerId === customer.id; });
      if (customerProjects.length === 1) return { id: customerProjects[0].id, name: customerProjects[0].name };
      if (customerProjects.length > 1) return null;
    }
    // 「顧客・案件」に正式登録されていなくても、メモ・見積・請求の自由テキストから拾う
    var freeMatch = findFreeTextProjectMatches(question);
    if (freeMatch.length > 0) return { name: freeMatch[0], freeText: true };
    return null;
  }

  function extractCustomerName(question) {
    // 顧客名を抽出。案件名と同じく、同一の質問理解ロジックに統合する。
    var customers = getCustomers();
    for (var i = 0; i < customers.length; i++) {
      if (question.indexOf(customers[i].name) !== -1) {
        return { id: customers[i].id, name: customers[i].name };
      }
    }
    return null;
  }

  function inferCategories(question) {
    // 質問から検索カテゴリを抽出する。固定のif文を増やすのではなく、
    // ルールの組み合わせで自然言語の表現差を吸収する。
    var categories = [];
    var rules = [
      { re: /(予定|スケジュール|何がある|何ある|いつ|明日|今日|今週|先週|日付)/, categories: ["scheduleEvents", "captures"] },
      { re: /(買い出し|購入|買った|何を買|買う|物品|材料)/, categories: ["receipts", "captures"] },
      { re: /(見積|見積書|見積額|いくら|金額|合計)/, categories: ["quotes"] },
      { re: /(請求|請求書|未請求|請求済|支払|振込)/, categories: ["invoices", "payments"] },
      { re: /(追加工事|変更工事|変更|工事)/, categories: ["changeOrders"] },
      { re: /(入金|未入金|入金額|支払い済|支払い)/, categories: ["payments", "invoices"] },
      { re: /(経費|費用|出費|支出|何で買った)/, categories: ["receipts"] },
      { re: /(写真|画像|現場写真|写真ある|どうなってる|状況|進捗|どんな)/, categories: ["photos", "quotes", "invoices", "payments", "receipts", "scheduleEvents", "changeOrders"] },
      { re: /(領収書|レシート|証拠|明細)/, categories: ["paymentReceipts", "receipts"] }
    ];

    rules.forEach(function (rule) {
      if (rule.re.test(question)) {
        rule.categories.forEach(function (category) {
          if (categories.indexOf(category) === -1) categories.push(category);
        });
      }
    });

    if (categories.length === 0) {
      categories = ["scheduleEvents", "quotes", "invoices", "changeOrders", "payments", "receipts", "photos", "captures"];
    }

    return categories;
  }

  function inferFilters(question) {
    // 質問から「フィルタ条件」を推定
    var filters = {};
    
    if (/(未請求|請求してない|まだ)/.test(question) && /請求/.test(question)) {
      filters.status = "unbilled";
    }
    if (/(入金されてない|未入金|支払われてない)/.test(question)) {
      filters.paymentStatus = "unpaid";
    }
    if (/(確定|承認|決定)/.test(question)) {
      filters.status = "confirmed";
    }
    
    return filters;
  }

  function interpretQuestion(question) {
    // Layer 1: 質問を分解して構造化条件（SearchIntent）を生成
    var dateRange = extractDateRange(question);
    var projectInfo = extractProjectName(question);
    var customerInfo = extractCustomerName(question);
    var categories = inferCategories(question);
    var filters = inferFilters(question);

    var hasResolvedProject = !!(projectInfo && projectInfo.id);
    var hasFreeTextProject = !!(projectInfo && !projectInfo.id && projectInfo.name);
    var customerProjectCount = customerInfo ? getProjects().filter(function (p) { return p.customerId === customerInfo.id; }).length : 0;
    var hasAmbiguousCustomer = !hasResolvedProject && !hasFreeTextProject && customerInfo && customerProjectCount > 1;

    // 案件・顧客を特定できなかった質問は、案件横断の集計・一覧クエリとして扱う
    var queryMode = "project";
    if (hasAmbiguousCustomer) {
      queryMode = "customer_projects";
    } else if (!hasResolvedProject && !hasFreeTextProject) {
      if (/未請求|請求.{0,4}(して.{0,2}ない|まだ)/.test(question)) {
        queryMode = "unbilled_list";
      } else if (/未入金|入金.{0,4}(され.{0,2}ない|して.{0,2}ない|まだ)/.test(question)) {
        queryMode = "unpaid_list";
      } else if (/(今月|先月)/.test(question) && /(請求|入金)/.test(question)) {
        queryMode = "monthly_totals";
      } else if (dateRange.from) {
        queryMode = "schedule";
      }
    }

    return {
      intentType: "search",
      queryMode: queryMode,
      searchIntents: [
        {
          projectId: hasResolvedProject ? projectInfo.id : null,
          projectName: projectInfo ? projectInfo.name : null,
          projectFreeText: hasFreeTextProject,
          customerId: customerInfo ? customerInfo.id : null,
          customerName: customerInfo ? customerInfo.name : null,
          dateRange: dateRange,
          categories: categories,
          filters: filters
        }
      ],
      originalQuestion: question
    };
  }

  // ---- Layer 2: データ横断検索層 ----
  function crossSearchData(searchIntent) {
    var targetProjects = [];

    if (searchIntent.projectId) {
      var singleProject = getProjects().find(function (p) { return p.id === searchIntent.projectId; });
      if (singleProject) targetProjects.push(singleProject);
    } else if (searchIntent.customerId) {
      targetProjects = getProjects().filter(function (p) { return p.customerId === searchIntent.customerId; });
    }

    // 各カテゴリでデータを検索
    var result = {
      projects: targetProjects.filter(Boolean),
      categories: {}
    };
    
    searchIntent.categories.forEach(function (category) {
      result.categories[category] = [];
      
      var allItems = loadList(KEYS[category]) || [];
      allItems.forEach(function (item) {
        if (!item.projectId) return;
        if (!targetProjects.some(function (p) { return p && p.id === item.projectId; })) return;
        
        // フィルタ適用
        if (searchIntent.filters.status === "unbilled" && category === "quotes") {
          var invoices = loadList(KEYS.invoices).filter(function (inv) { return inv.projectId === item.projectId; });
          if (invoices.length > 0) return;
        }
        if (searchIntent.filters.paymentStatus === "unpaid" && category === "invoices") {
          var payments = loadList(KEYS.payments).filter(function (p) { return p.invoiceId === item.id; });
          var totalPaid = payments.reduce(function (sum, p) { return sum + (p.amount || 0); }, 0);
          var totalAmount = calcTotals(item.items).total;
          if (totalPaid >= totalAmount) return;
        }
        
        // 日付範囲で検索
        if (searchIntent.dateRange.from && item.date) {
          if (item.date < searchIntent.dateRange.from || item.date > searchIntent.dateRange.to) return;
        }
        
        result.categories[category].push(item);
      });
    });
    
    return result;
  }

  // ---- Layer 3: 案件統合層 ----
  function buildProjectSnapshot(projectId, allData) {
    var project = getProjects().find(function (p) { return p.id === projectId; });
    if (!project) return null;
    
    var customer = getCustomers().find(function (c) { return c.id === project.customerId; });
    var sel = projectSelectionInfo(projectId);
    
    var quotes = allData.categories.quotes || [];
    var invoices = allData.categories.invoices || [];
    var changeOrders = allData.categories.changeOrders || [];
    var receipts = allData.categories.receipts || [];
    var photos = allData.categories.photos || [];
    var scheduleEvents = allData.categories.scheduleEvents || [];
    // 入金（payments）はinvoiceIdでのみ紐付き、projectIdを持たないため案件横断検索の
    // 対象にできない。案件の請求書ごとに正しく集計する（既存のgetInvoicePaymentInfoを再利用）。
    var payments = [];
    invoices.forEach(function (inv) { payments = payments.concat(paymentsForInvoice(inv.id)); });

    // 金銭情報を計算
    var quoteAmount = quotes.reduce(function (sum, q) { return sum + calcTotals(q.items).total; }, 0);
    var invoiceAmount = invoices.reduce(function (sum, inv) { return sum + calcTotals(inv.items).total; }, 0);
    var changeOrderAmount = changeOrders.reduce(function (sum, c) { return sum + (c.amount || 0); }, 0);
    var paidAmount = invoices.reduce(function (sum, inv) {
      var total = calcTotals(inv.items).total;
      return sum + getInvoicePaymentInfo(inv.id, total).paidAmount;
    }, 0);
    var expenseAmount = receipts.reduce(function (sum, r) { return sum + (r.amount || 0); }, 0);
    
    var financials = {
      quoteAmount: quoteAmount,
      changeOrderAmount: changeOrderAmount,
      invoiceAmount: invoiceAmount,
      paidAmount: paidAmount,
      unpaidAmount: invoiceAmount - paidAmount,
      expenseAmount: expenseAmount,
      profit: invoiceAmount - expenseAmount
    };
    
    return {
      projectId: projectId,
      customer: customer,
      project: project,
      selection: sel,
      financials: financials,
      documents: {
        quotes: quotes,
        invoices: invoices,
        changeOrders: changeOrders
      },
      payments: payments,
      receipts: receipts,
      photos: photos,
      scheduleEvents: scheduleEvents
    };
  }

  // ---- Layer 4: 回答生成層 ----
  function generateAnswer(originalQuestion, projectSnapshot) {
    if (!projectSnapshot) {
      return {
        text: "該当する案件が見つかりませんでした。登録されている案件名・顧客名の中で一致するものがないため、質問の対象を特定できていません。"
      };
    }

    var snap = projectSnapshot;
    var fin = snap.financials;

    // 「どうなってる？」「状況」→ 全体サマリー
    if (/どうなってる|状況|進捗/.test(originalQuestion)) {
      var text = snap.selection.projectName + "の状況：\n";

      if (fin.quoteAmount > 0) {
        text += "・見積：" + yen(fin.quoteAmount) + "\n";
      } else {
        text += "・見積：未登録\n";
      }

      if (fin.changeOrderAmount > 0) {
        text += "・追加工事：" + yen(fin.changeOrderAmount) + "\n";
      }

      if (fin.invoiceAmount > 0) {
        text += "・請求：" + yen(fin.invoiceAmount) + "\n";
        text += "・入金：" + yen(fin.paidAmount) + "\n";
        if (fin.unpaidAmount > 0) {
          text += "（未入金：" + yen(fin.unpaidAmount) + "）\n";
        }
      } else {
        text += "・請求：未登録\n";
      }

      if (fin.expenseAmount > 0) {
        text += "・経費：" + yen(fin.expenseAmount) + "\n";
      }

      var nextSched = snap.scheduleEvents.filter(function (s) { return s.date >= todayStr(); })
        .sort(function (a, b) { return (a.date + (a.startTime || "")).localeCompare(b.date + (b.startTime || "")); })[0];
      if (nextSched) {
        text += "・次の予定：" + nextSched.date + (nextSched.startTime ? " " + nextSched.startTime : "") + " " + esc(nextSched.title) + "\n";
      }

      if (snap.photos.length > 0) {
        text += "・写真：" + snap.photos.length + " 枚";
      }

      return { text: text.replace(/\n+$/, ""), data: snap, links: [] };
    }

    // 「いくら入金済み？」「未入金は？」→ 入金にしぼった回答
    if (/入金/.test(originalQuestion)) {
      if (fin.invoiceAmount === 0) {
        return { text: snap.selection.projectName + "はまだ請求書が登録されていません。" };
      }
      return {
        text: "入金済み：" + yen(fin.paidAmount) + "\n未入金：" + yen(fin.unpaidAmount),
        data: fin
      };
    }

    if (/いくら|金額|合計/.test(originalQuestion)) {
      var text2 = "";
      if (/見積/.test(originalQuestion)) {
        text2 = fin.quoteAmount > 0 ? "見積：" + yen(fin.quoteAmount) : "見積が登録されていません。";
      } else if (/請求/.test(originalQuestion)) {
        text2 = fin.invoiceAmount > 0 ? "請求：" + yen(fin.invoiceAmount) + (fin.unpaidAmount > 0 ? "（未入金：" + yen(fin.unpaidAmount) + "）" : "") : "請求が登録されていません。";
      } else if (/経費/.test(originalQuestion)) {
        text2 = fin.expenseAmount > 0 ? "経費：" + yen(fin.expenseAmount) : "経費が登録されていません。";
      } else {
        text2 = "見積：" + yen(fin.quoteAmount) + "\n請求：" + yen(fin.invoiceAmount) + "\n入金：" + yen(fin.paidAmount) + "\n経費：" + yen(fin.expenseAmount);
      }
      return { text: text2, data: fin, links: [] };
    }

    // 「写真ある？」→ 写真の有無
    if (/写真/.test(originalQuestion)) {
      if (snap.photos.length === 0) {
        return { text: "写真の登録がありません。" };
      }
      return { text: "写真が" + snap.photos.length + "枚登録されています。", data: { count: snap.photos.length } };
    }

    // 「追加工事ある？」→ 追加工事の有無
    if (/追加工事|変更/.test(originalQuestion)) {
      if (snap.documents.changeOrders.length === 0) {
        return { text: "追加工事の登録がありません。" };
      }
      var coLines = snap.documents.changeOrders.map(function (c) {
        return (c.billed ? "[請求済み] " : "[未請求] ") + c.description + " " + yen(c.amount);
      });
      return { text: "追加工事が" + snap.documents.changeOrders.length + "件、合計" + yen(fin.changeOrderAmount) + "です。", lines: coLines };
    }

    // 「見積は？」→ 見積書の一覧（いくら、を伴わない聞き方）
    if (/見積/.test(originalQuestion)) {
      if (snap.documents.quotes.length === 0) {
        return { text: "見積書の登録がありません。" };
      }
      var qLines = snap.documents.quotes.map(function (d) {
        var badge = d.parentQuoteId ? (d.approvalStatus === "approved" ? "[追加見積・承認済み] " : "[追加見積・承認待ち] ") : "";
        return badge + (d.docNumber || "") + "　" + (d.issueDate || "") + "　" + yen(calcTotals(d.items).total);
      });
      return { text: snap.selection.projectName + "の見積書が" + snap.documents.quotes.length + "件、合計" + yen(fin.quoteAmount) + "です。", lines: qLines };
    }

    // 「請求は？」→ 請求書の一覧（いくら、を伴わない聞き方）
    if (/請求/.test(originalQuestion)) {
      if (snap.documents.invoices.length === 0) {
        return { text: "請求書の登録がありません。" };
      }
      var iLines = snap.documents.invoices.map(function (d) {
        var total = calcTotals(d.items).total;
        var info = getInvoicePaymentInfo(d.id, total);
        return (d.docNumber || "") + "　" + yen(total) + "（" + info.status + "）";
      });
      return { text: snap.selection.projectName + "の請求書が" + snap.documents.invoices.length + "件、合計" + yen(fin.invoiceAmount) + "です。", lines: iLines };
    }

    // デフォルト
    return { text: "情報を検索しましたが、質問に完全にお答えできませんでした。", data: snap };
  }

  // ---- Layer 3-4 拡張: 案件を特定できない「一覧・集計」質問への回答 ----
  // （未請求/未入金の案件一覧、今月の請求・入金合計、日付の予定など）
  // Query層の既存関数（getUnbilledProjects等）をそのまま呼び出すだけで、
  // 新しいデータ保持や重複ロジックは持たない。
  function answerUnbilledProjectsList() {
    var list = getUnbilledProjects();
    if (list.length === 0) return { text: "未請求の案件はありません。" };
    return { text: "未請求の案件が" + list.length + "件あります。", projectCards: list };
  }

  function answerUnpaidInvoicesList() {
    var invoices = getUnpaidInvoices();
    if (invoices.length === 0) return { text: "未入金の請求書はありません。" };
    var remainTotal = invoices.reduce(function (sum, inv) {
      var total = calcTotals(inv.items).total;
      return sum + getInvoicePaymentInfo(inv.id, total).remaining;
    }, 0);
    var seen = {};
    var projects = [];
    invoices.forEach(function (inv) {
      if (inv.projectId && !seen[inv.projectId]) {
        seen[inv.projectId] = true;
        var p = findProject(inv.projectId);
        if (p) projects.push(p);
      }
    });
    return {
      text: "未入金の案件が" + projects.length + "件、残り合計 " + yen(remainTotal) + " です。",
      projectCards: projects.length ? projects : null,
      invoiceCards: projects.length ? null : invoices
    };

  function answerMonthlyTotals(question, dateRange) {
    var ym = (dateRange && dateRange.from) ? dateRange.from.slice(0, 7) : todayStr().slice(0, 7);
    var label = /先月/.test(question) ? "先月" : "今月";
    var wantInvoiced = /請求/.test(question);
    var wantPaid = /入金/.test(question);
    if (!wantInvoiced && !wantPaid) { wantInvoiced = true; wantPaid = true; }
    var lines = [];
    if (wantInvoiced) lines.push(label + "の請求額は合計 " + yen(getMonthlyInvoicedTotal(ym)) + " です。");
    if (wantPaid) lines.push(label + "の入金額は合計 " + yen(getMonthlyPaidTotal(ym)) + " です。");
    return { text: lines.join("\n") };
  }

  function scheduleDateLabel(question, dateRange) {
    if (/今日|きょう/.test(question)) return "今日";
    if (/明日|あした/.test(question)) return "明日";
    if (/今週|こんしゅう/.test(question)) return "今週";
    if (/先週|せんしゅう/.test(question)) return "先週";
    if (/今月|こんげつ/.test(question)) return "今月";
    if (/先月|せんげつ/.test(question)) return "先月";
    return dateRange.from === dateRange.to ? dateRange.from : (dateRange.from + "〜" + dateRange.to);
  }

  function answerSchedule(question, dateRange) {
    if (!dateRange || !dateRange.from) {
      return { text: "日付を認識できませんでした。「今日」「明日」「8月13日」のように聞いてみてください。" };
    }
    var label = scheduleDateLabel(question, dateRange);
    var events = loadScheduleEvents().filter(function (s) { return s.date >= dateRange.from && s.date <= dateRange.to; })
      .sort(function (a, b) { return (a.date + (a.startTime || "")).localeCompare(b.date + (b.startTime || "")); });
    var memoMatches = loadList(KEYS.captures).filter(function (c) {
      var iso = resolveCaptureDateToIso(c);
      return iso && iso >= dateRange.from && iso <= dateRange.to;
    });
    if (events.length === 0 && memoMatches.length === 0) {
      return { text: label + "の予定は登録されていません。" };
    }
    var lines = events.map(function (s) {
      var sel = projectSelectionInfo(s.projectId);
      return (dateRange.from !== dateRange.to ? s.date + " " : "") + (s.startTime ? s.startTime + " " : "") + (sel && sel.projectName ? sel.projectName + "：" : "") + s.title;
    });
    memoMatches.forEach(function (c) {
      var content = (c.confirmed && c.confirmed.content) || c.rawText || "";
      lines.push("📝 " + content.slice(0, 40));
    });
    return { text: label + "の予定は" + (events.length + memoMatches.length) + "件です。", lines: lines };
  }

  function answerCustomerProjects(customerId, customerName) {
    var projs = getProjects().filter(function (p) { return p.customerId === customerId; });
    if (projs.length === 0) return { text: customerName + "の案件は見つかりませんでした。" };
    return { text: customerName + "の案件が" + projs.length + "件あります。どちらですか？", projectCards: projs };

  function answerFreeTextProject(name) {

    return {
      text: "「" + name + "」はまだ「顧客・案件」に正式登録されていません。関連する記録から分かる範囲でお答えします。",

    };

  // ============================================================
  // 「請求書を作って」等、明示的な操作依頼に対する下書き生成
  // （チャットのproject向け回答から、案件が1件特定できた場合にのみ呼ばれる）
  // ============================================================
  function buildInvoiceDraftResponse(projectId) {
    var sel = projectSelectionInfo(projectId);
    var quotes = getQuotesByProject(projectId).sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
    var unbilledCO = unbilledChangeOrders(projectId);
    if (quotes.length === 0 && unbilledCO.length === 0) {

    }
    var items = quotes.length ? quotes[0].items.map(function (it) { return Object.assign({}, it); }) : [];
    var coItems = unbilledCO.map(function (c) { return { category: "追加工事", spec: c.description, qty: 1, unit: "式", unitPrice: c.amount }; });
    var allItems = items.concat(coItems);

    return {
      text: sel.projectName + "の請求書案です。内容を確認して作成できます。",

  function loadCompany() {

  var DOC_KEY_BY_KIND = { quote: "quotes", invoice: "invoices", receipt: "paymentReceipts" };
  var DOC_PREFIX_BY_KIND = { quote: "EST", invoice: "INV", receipt: "RCP" };

  function nextDocNumber(kind) {
    var year = new Date().getFullYear();

    var seq = list.length + 1;
    return DOC_PREFIX_BY_KIND[kind] + "-" + year + "-" + ("00" + seq).slice(-3);

  // いただいた見積書・請求書・領収書サンプルの内容を初期値として使用（すべて作成後に編集可能）
  var DEFAULT_DUE_NOTE = { quote: "発行日より30日間", invoice: "月末締め翌月末払い" };

    invoice: "恐れ入りますが、振込手数料はご負担ください。"

  function defaultDocForm(kind) {

    };

  // 追加見積書の番号は「元の見積番号-A1」のように連番にする
  function nextAdditionalQuoteNumber(parentQuoteId) {
    var quotes = loadList(KEYS.quotes);
    var parent = quotes.find(function (q) { return q.id === parentQuoteId; });
    var baseNumber = (parent && parent.docNumber) || nextDocNumber("quote");
    var siblingCount = quotes.filter(function (q) { return q.parentQuoteId === parentQuoteId; }).length;
    return baseNumber + "-A" + (siblingCount + 1);
  }
  // 追加見積書は既存の見積書フォームをそのまま流用し、元見積の宛先・現場情報を引き継ぐ
  function defaultAdditionalQuoteForm(parentQuoteId) {

    var parent = loadList(KEYS.quotes).find(function (q) { return q.id === parentQuoteId; });
    base.docNumber = nextAdditionalQuoteNumber(parentQuoteId);
    base.parentQuoteId = parentQuoteId;
    base.approvalStatus = "pending";

      base.projectId = parent.projectId;

      base.workLocation = parent.workLocation;
      base.periodStart = parent.periodStart;

  }
  function nl2br(s) {
    return (s == null ? "" : String(s)).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
  }

  function findDoc(id) {
    var kinds = ["quote", "invoice", "receipt"];
    for (var k = 0; k < kinds.length; k++) {
      var key = KEYS[DOC_KEY_BY_KIND[kinds[k]]];
      var doc = loadList(key).find(function (x) { return x.id === id; });
      if (doc) return { doc: doc, kind: kinds[k], key: key };
    }
    return null;
  }

  // ---- 「AI整理」の仮実装（ルールベース。将来: 無料枠LLMに差し替え予定） ----
  function monthDayToIso(s) {
    var m = s && s.match(/(\d{1,2})月(\d{1,2})日/);
    if (!m) return "";
    return new Date().getFullYear() + "-" + ("0" + m[1]).slice(-2) + "-" + ("0" + m[2]).slice(-2);
  }
  // 「話す入力」メモの日付欄（自由テキスト）を可能な範囲でISO日付に変換する
  // （メモを作った日を基準に「今日」「明日」等の相対表現を解決する）
  function resolveCaptureDateToIso(capture) {
    var d = (capture.confirmed && capture.confirmed.date) || "";
    var createdDate = (capture.createdAt || "").slice(0, 10);
    if (/^\d{1,2}月\d{1,2}日$/.test(d)) return monthDayToIso(d);
    if (d === "今日") return createdDate;
    if (d === "明日") return createdDate ? addDays(createdDate, 1) : "";
    if (d === "明後日") return createdDate ? addDays(createdDate, 2) : "";
    return "";
  }

  function structureText(raw) {
    var date = "";
    var dateMatch = raw.match(/(明日|今日|明後日|\d{1,2}月\d{1,2}日)/);
    if (dateMatch) date = dateMatch[1];
    var time = "";
    var timeMatch = raw.match(/\d{1,2}時(\d{1,2}分)?/);
    if (timeMatch) time = timeMatch[0];
    var customer = "";
    var customerMatch = raw.match(/([^\s、。]{1,10})(さん|様|工務店|建設|商店)/);
    if (customerMatch) customer = customerMatch[1] + customerMatch[2];
    var project = "";
    var projectMatch = raw.match(/([^\s、。]{1,12}邸)/);
    if (projectMatch) project = projectMatch[1];

    var workLocation = "";
    var locMatch = raw.match(/(?:現場|場所)は?([^\s、。]{1,20})/);
    if (locMatch) workLocation = locMatch[1];

    var periodStart = "", periodEnd = "";
    var periodMatch = raw.match(/(\d{1,2}月\d{1,2}日)\s*(?:から|〜|~|-)\s*(\d{1,2}月\d{1,2}日)/);
    if (periodMatch) {
      periodStart = monthDayToIso(periodMatch[1]);
      periodEnd = monthDayToIso(periodMatch[2]);
    }

    var tasks = "";
    var taskMatch = raw.match(/([^\s、。]{1,20}(?:買|購入)[^\s、。]{0,10})/);
    if (taskMatch) tasks = taskMatch[1];

    return {
      date: date, time: time, customer: customer, project: project,
      workLocation: workLocation, periodStart: periodStart, periodEnd: periodEnd,
      content: raw, tasks: tasks
    };
  }

  function calcTotals(items) {
    var subtotal = items.reduce(function (sum, it) {
      return sum + (Number(it.qty) || 0) * (Number(it.unitPrice) || 0);
    }, 0);
    var tax = Math.round(subtotal * 0.1);
    return { subtotal: subtotal, tax: tax, total: subtotal + tax };
  }

  // 領収金額（税込）から税抜額・消費税額を逆算する
  function receiptTaxBreakdown(amount) {
    var total = Number(amount) || 0;
    var excluded = Math.round(total / 1.1);
    return { excluded: excluded, tax: total - excluded, total: total };
  }

  // ---- 音声入力（Web Speech API。file://等の非セキュアな環境やブラウザ非対応では動作しない） ----
  var SpeechRecognitionApi = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recognition = null;
  var isListening = false;

  function micSupportInfo() {
    if (!SpeechRecognitionApi) return { ok: false, reason: "このブラウザは音声入力に対応していません。" };
    if (!window.isSecureContext) return { ok: false, reason: "ファイルを直接開いているため、この環境ではマイクを使えません（Netlify等HTTPS配信後は使用できます）。" };
    return { ok: true, reason: "" };
  }

  function toggleMic(onResultAppend, onStateChange, onInterim) {
    var info = micSupportInfo();
    if (!info.ok) { onStateChange(false, info.reason); return; }
    if (isListening) {
      recognition && recognition.stop();
      return;
    }
    recognition = new SpeechRecognitionApi();
    recognition.lang = "ja-JP";
    recognition.interimResults = true;
    recognition.continuous = true;
    recognition.onstart = function () { isListening = true; onStateChange(true, ""); };
    recognition.onend = function () { isListening = false; onStateChange(false, ""); };
    recognition.onerror = function (e) {
      isListening = false;
      if (e.error === "no-speech" || e.error === "aborted") { onStateChange(false, ""); return; }
      var msg = "マイクを利用できませんでした（" + e.error + "）。テキストで入力してください。";
      onStateChange(false, msg);
    };
    recognition.onresult = function (e) {
      var finalText = "";
      var interimText = "";
      for (var i = e.resultIndex; i < e.results.length; i++) {
        var t = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalText += t;
        else interimText += t;
      }
      if (finalText) onResultAppend(finalText);
      if (onInterim) onInterim(interimText);
    };
    try { recognition.start(); } catch (err) { onStateChange(false, "マイクを開始できませんでした。"); }
  }

  // ---- 画像リサイズ（localStorage容量を圧迫しないよう縮小してから保存） ----
  function resizeImageFile(file, maxWidth, quality, cb) {
    var img = new Image();
    var reader = new FileReader();
    reader.onload = function (e) {
      img.onload = function () {
        var scale = Math.min(1, maxWidth / img.width);
        var w = Math.round(img.width * scale);
        var h = Math.round(img.height * scale);
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        cb(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ---- レシートOCR（Tesseract.js無料版。認識精度は簡易的なため必ず人が確認する前提） ----
  function runReceiptOCR(imageDataUrl, statusEl, storeInput, amountInput) {
    if (typeof Tesseract === "undefined") {
      statusEl.textContent = "OCRの準備ができていません。通信環境を確認し、少し待ってから再度お試しください。";
      return;
    }
    statusEl.textContent = "読み取り中…（初回は言語データの取得で数十秒かかることがあります）";
    Tesseract.recognize(imageDataUrl, "jpn+eng")
      .then(function (result) {
        var text = (result && result.data && result.data.text) || "";
        var numMatches = text.match(/[\d,]{3,9}/g) || [];
        var nums = numMatches
          .map(function (m) { return Number(m.replace(/,/g, "")); })
          .filter(function (n) { return n >= 100 && n <= 10000000; });
        var amount = nums.length ? Math.max.apply(null, nums) : null;
        var firstLine = text.split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean)[0] || "";
        if (amount) amountInput.value = amount;
        if (firstLine) storeInput.value = firstLine;
        statusEl.textContent = (amount || firstLine)
          ? "読み取りました。内容を必ず確認・修正してください（精度は簡易的です）。"
          : "うまく読み取れませんでした。手入力してください。";
      })
      .catch(function () {
        statusEl.textContent = "読み取りに失敗しました。手入力してください。";
      });
  }

  // ---- Excel(.xlsx)出力（SheetJS無料版。数値のみ・数式や色などの装飾は非対応） ----
  function exportXlsx(d, kind) {
    if (typeof XLSX === "undefined") { alert("Excel出力の準備ができていません。通信環境を確認し、少し待ってから再度お試しください。"); return; }
    var company = loadCompany();

    if (kind === "receipt") {
      var rt = receiptTaxBreakdown(d.amountReceived);
      var rrows = [
        ["領収書"], [],
        ["領収書番号", d.docNumber, "", "発行日", d.issueDate],
        ["宛名", (d.customerName || "") + " 様"], [],
        ["金額", d.amountReceived], [],
        ["税抜金額", rt.excluded], ["消費税(10%)", rt.tax], [],
        ["但し書き", d.description || ""], [],
        ["発行元", company.name || ""],
        ["住所", (company.zip ? company.zip + " " : "") + (company.address || "")],
        ["TEL/FAX", (company.tel || "") + " / " + (company.fax || "")],
        ["登録番号", company.invoiceRegNo || ""], [],
        ["※5万円以上の領収書には収入印紙の貼付が必要です（金額により印紙税額が異なります）。この出力は数値のみのため、印紙欄・押印欄は含まれません。"]
      ];
      var rws = XLSX.utils.aoa_to_sheet(rrows);
      rws["!cols"] = [{ wch: 14 }, { wch: 26 }, { wch: 8 }, { wch: 8 }, { wch: 12 }];
      var rwb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(rwb, rws, "領収書");
      XLSX.writeFile(rwb, "領収書_" + (d.docNumber || d.id) + ".xlsx");
      return;
    }

    var isInvoice = kind === "invoice";
    var t = calcTotals(d.items);
    var rows = [];
    rows.push([isInvoice ? "請求書" : "御見積書"]);
    rows.push([]);
    rows.push([isInvoice ? "請求番号" : "見積番号", d.docNumber, "", "発行日", d.issueDate]);
    rows.push(["顧客名", (d.customerName || "") + " 様"]);
    rows.push([]);
    rows.push(["件名", d.project || ""]);
    rows.push(["工事場所", d.workLocation || ""]);
    rows.push(["工期", (d.periodStart || "") + " 〜 " + (d.periodEnd || "")]);
    rows.push([isInvoice ? "支払期限" : "有効期限", (d.dueDate || "") + (d.dueDateNote ? "（" + d.dueDateNote + "）" : "")]);
    rows.push([]);
    rows.push(["項目", "仕様・摘要", "数量", "単位", "単価", "金額"]);
    d.items.forEach(function (it) {
      rows.push([it.category || "", it.spec || "", Number(it.qty) || 0, it.unit || "", Number(it.unitPrice) || 0, (Number(it.qty) || 0) * (Number(it.unitPrice) || 0)]);
    });
    rows.push(["", "", "", "", "小計", t.subtotal]);
    rows.push(["", "", "", "", "消費税(10%)", t.tax]);
    rows.push(["", "", "", "", "合計", t.total]);
    rows.push([]);
    if (!isInvoice) rows.push(["お支払条件", d.paymentTerms || ""]);
    rows.push(["備考", d.remarks || ""]);
    rows.push([]);
    rows.push(["発行元", company.name || ""]);
    rows.push(["住所", (company.zip ? company.zip + " " : "") + (company.address || "")]);
    rows.push(["TEL/FAX", (company.tel || "") + " / " + (company.fax || "")]);
    rows.push(["登録番号", company.invoiceRegNo || ""]);
    rows.push(["お振込先", [company.bankName, company.bankBranch, company.accountType, company.accountNumber].filter(Boolean).join(" ")]);
    rows.push(["口座名義", company.accountHolder || ""]);

    var ws = XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"] = [{ wch: 14 }, { wch: 26 }, { wch: 8 }, { wch: 8 }, { wch: 12 }, { wch: 12 }];
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, isInvoice ? "請求書" : "見積書");
    XLSX.writeFile(wb, (isInvoice ? "請求書_" : "見積書_") + (d.docNumber || d.id) + ".xlsx");
  }

  // ---- ルーティング ----
  var state = { view: "home" };
  // チャット履歴はstateではなくモジュール変数で保持する（go()で画面遷移してもstateは
  // 毎回作り直されるため。チャット専用のデータストア(localStorage等)は作らない）
  var chatHistory = [];
  var lastInvoiceDraft = null;

  function go(view, payload) {
    state = { view: view };
    if (payload) Object.assign(state, payload);
    render();
  }
  function patch(payload) { Object.assign(state, payload); render(); }

  function render() {
    var app = document.getElementById("app");
    var v = state.view;
    var html;
    if (v === "home") html = renderHome();
    else if (v === "capture") html = renderCapture();
    else if (v === "confirm") html = renderConfirm();
    else if (v === "history") html = renderHistory();
    else if (v === "detail") html = renderDetail(state.detailId);
    else if (v === "receiptList") html = renderReceiptList();
    else if (v === "receiptCapture") html = renderReceiptCapture();
    else if (v === "receiptDetail") html = renderReceiptDetail(state.receiptId);
    else if (v === "docList") html = renderDocList();
    else if (v === "docForm") html = renderDocForm();
    else if (v === "docDetail") html = renderDocDetail(state.docId);
    else if (v === "settings") html = renderSettings();
    else if (v === "projectPicker") html = renderProjectPicker();
    else if (v === "projectList") html = renderProjectList();
    else if (v === "projectDetail") html = renderProjectDetail(state.projectId);
    else if (v === "changeOrderReview") html = renderChangeOrderReview();
    else if (v === "photoCapture") html = renderPhotoCapture();
    else if (v === "photoDetail") html = renderPhotoDetail(state.photoId);
    else if (v === "scheduleForm") html = renderScheduleForm();
    else if (v === "chat") html = renderChat();
    else html = renderHome();
    app.innerHTML = html + renderBottomNav();
    bindEvents();
    var chatLog = document.getElementById("chatLog");
    if (chatLog) window.scrollTo(0, document.body.scrollHeight);
    // iOS で音声入力画面を開いた際、mic ボタンをフォーカスしてキーボード自動表示を回避
    if (v === "capture") {
      setTimeout(function () {
        var micBtn = document.getElementById("micBtn");
        if (micBtn) micBtn.focus();
      }, 100);
    }
  }

        '<div class="item-card" data-idx="' + i + '">' +

        '<input type="text" class="it-unit" placeholder="単位" value="' + esc(it.unit) + '">' +

        spec: card.querySelector(".it-spec").value,

        unit: card.querySelector(".it-unit").value,

    if (!project) return '<header><button class="back" data-go="projectList">← 戻る</button></header><p>案件が見つかりません。</p>';
    var customer = project.customerId ? findCustomer(project.customerId) : null;

    var quotes = loadList(KEYS.quotes).filter(function (d) { return d.projectId === projectId; });
    var mainQuotes = quotes.filter(function (d) { return !d.parentQuoteId; });
    var additionalQuotes = quotes.filter(function (d) { return d.parentQuoteId; });
    var invoices = loadList(KEYS.invoices).filter(function (d) { return d.projectId === projectId; });
    var receipts2 = loadList(KEYS.paymentReceipts).filter(function (d) { return d.projectId === projectId; });
    var expenses = loadList(KEYS.receipts).filter(function (d) { return d.projectId === projectId; });
    var memos = loadList(KEYS.captures).filter(function (d) { return d.projectId === projectId; });
    var changeOrders = loadChangeOrders().filter(function (c) { return c.projectId === projectId; });
    var photos = loadPhotos().filter(function (p) { return p.projectId === projectId; });
    var schedule = loadScheduleEvents().filter(function (s) { return s.projectId === projectId; }).sort(function (a, b) { return (a.date || "").localeCompare(b.date || ""); });

    function docLine(d, kind) {
      var total = kind === "receipt" ? Number(d.amountReceived) || 0 : calcTotals(d.items).total;
      var payBadge = "";
      if (kind === "invoice") {
        var info = getInvoicePaymentInfo(d.id, total);
        payBadge = '<span class="status-pill" style="margin-left:6px;' + (info.status === "入金済み" ? "background:var(--ok);color:#fff" : "") + '">' + info.status + '</span>';
      }
      return '<div class="card" data-doc="' + d.id + '"><div class="top-line"><span>' + (d.docNumber || "") + payBadge + '</span><span>' + (d.issueDate || "") + '</span></div><div class="content-preview">' + yen(total) + '</div></div>';
    }
    function section(title, itemsHtml, emptyText) {
      return '<label style="margin-top:20px">' + title + '</label>' + (itemsHtml || '<div class="content-preview">' + emptyText + '</div>');
    }

    var coHtml = changeOrders.map(function (c) {
      return '<div class="card" style="cursor:default"><div class="top-line"><span class="status-pill" style="' + (c.billed ? "background:var(--ok);color:#fff" : "") + '">' + (c.billed ? "請求済み" : "未請求") + '</span></div>' +
        '<div class="customer-project">' + c.description + '</div><div class="content-preview">' + yen(c.amount) + '</div></div>';
    }).join("");

    var aqHtml = additionalQuotes.map(function (q) {
      var total = calcTotals(q.items).total;
      var approved = q.approvalStatus === "approved";
      return '<div class="card" data-doc="' + q.id + '"><div class="top-line"><span class="status-pill" style="' + (approved ? "background:var(--ok);color:#fff" : "") + '">' + (approved ? "承認済み" : "承認待ち") + '</span><span>' + (q.docNumber || "") + '</span></div><div class="content-preview">' + yen(total) + '</div></div>';
    }).join("");

    return (
      '<header><button class="back" data-go="projectList">← 戻る</button><h1>案件詳細</h1></header>' +
      '<div class="card" style="cursor:default">' +
      '<div class="customer-project">' + [customer ? customer.name : "(顧客未設定)", project.name].filter(Boolean).join(" ／ ") + '</div>' +
      (project.workLocation ? '<div class="content-preview">現場: ' + project.workLocation + '</div>' : "") +
      (project.periodStart || project.periodEnd ? '<div class="content-preview">工期: ' + (project.periodStart || "") + ' 〜 ' + (project.periodEnd || "") + '</div>' : "") +
      (customer && customer.tel ? '<div class="content-preview">TEL: ' + customer.tel + '</div>' : "") +
      '</div>' +
      '<label>進捗</label>' +
      '<select id="stageSelect">' + PROJECT_STAGES.map(function (s) { return '<option' + (s === project.stage ? " selected" : "") + '>' + s + '</option>'; }).join("") + '</select>' +
      '<div style="display:flex;gap:8px;margin-top:14px">' +
      '<button class="secondary-btn" id="quickQuoteBtn" style="margin-top:0">＋見積書</button>' +
      '<button class="secondary-btn" id="quickInvoiceBtn" style="margin-top:0">＋請求書</button>' +
      '</div>' +
      section("見積書", mainQuotes.map(function (d) { return docLine(d, "quote"); }).join(""), "まだありません") +
      section("追加見積書", aqHtml, "まだありません") +
      '<button class="secondary-btn" id="addAdditionalQuoteBtn" style="margin-top:10px">＋追加見積書を作成</button>' +
      section("請求書", invoices.map(function (d) { return docLine(d, "invoice"); }).join(""), "まだありません") +
      section("領収書", receipts2.map(function (d) { return docLine(d, "receipt"); }).join(""), "まだありません") +
      section("経費・レシート", expenses.map(function (r) {
        return '<div class="card" data-receipt="' + r.id + '"><div class="customer-project">' + (r.store || "(店舗未入力)") + ' ' + yen(r.amount) + '</div><div class="content-preview">' + (r.date || "") + '</div></div>';
      }).join(""), "まだありません") +
      section("メモ", memos.map(function (m) {
        return '<div class="card" data-detail="' + m.id + '"><div class="content-preview">' + (m.confirmed.content || "").slice(0, 40) + '</div></div>';
      }).join(""), "まだありません") +
      section("追加工事", coHtml, "まだありません") +
      '<div class="card" style="cursor:default">' +
      '<label style="margin:0 0 6px">＋追加工事を記録</label>' +
      '<input type="text" id="co_description" placeholder="例: 建具交換">' +
      '<input type="number" id="co_amount" placeholder="金額（円）" style="margin-top:8px">' +
      '<button class="secondary-btn" id="addChangeOrderBtn">記録する</button>' +

      section("予定", schedule.map(function (s) {

      }).join(""), "まだありません") +
      '<button class="secondary-btn" id="addScheduleBtn">＋予定を追加</button>' +
      section("写真", photos.map(function (p) {
        return '<div class="card" data-photo="' + p.id + '" style="display:flex;align-items:center;gap:10px">' +
          '<img src="' + p.imageDataUrl + '" style="width:52px;height:52px;object-fit:cover;border-radius:8px;flex:0 0 auto">' +

      (lines.join("") || '<div class="content-preview">関連する記録が見つかりませんでした。</div>') + '</div>';

    return html;

  function buildGeneralFallbackResponse(question, searchResults) {
    // ルールベースに限界があるので、回答できない時は「何が分かっているか」を明示する。
    var known = [];
    var missing = [];
    var projectNames = (searchResults.projects || []).map(function (p) { return p && p.name ? p.name : ""; }).filter(Boolean);

    if (projectNames.length) {
      known.push("案件名: " + projectNames.join(" / ") + " は確認できています");
    }
    if ((searchResults.categories && searchResults.categories.quotes && searchResults.categories.quotes.length)) {
      known.push("見積情報は登録されています");
    }
    if ((searchResults.categories && searchResults.categories.invoices && searchResults.categories.invoices.length)) {
      known.push("請求・入金情報は登録されています");
    }
    if ((searchResults.categories && searchResults.categories.photos && searchResults.categories.photos.length)) {
      known.push("写真は登録されています");
    }
    if ((searchResults.categories && searchResults.categories.scheduleEvents && searchResults.categories.scheduleEvents.length)) {
      known.push("予定情報は登録されています");
    }

    if (!projectNames.length) missing.push("対象の顧客・案件名");
    if (!(searchResults.categories && searchResults.categories.quotes && searchResults.categories.quotes.length)) missing.push("見積");
    if (!(searchResults.categories && searchResults.categories.invoices && searchResults.categories.invoices.length)) missing.push("請求/入金");
    if (!(searchResults.categories && searchResults.categories.photos && searchResults.categories.photos.length)) missing.push("写真");

    var note = known.length ? "登録されている情報としては、" + known.join(" / ") + " が確認できます。" : "該当する顧客・案件名はまだ登録されていません。";
    var detail = missing.length ? "一方で、" + missing.join(" / ") + " に関する登録はまだありません。" : "それ以外の情報も確認できる範囲で反映しています。";

    return { text: note + "\n" + detail + "\n\n質問の対象が特定できない場合は、案件名または顧客名を含めて聞いてください。", data: searchResults };
  }

  function renderChatMessage(m) {
    if (m.role === "user") {
      return '<div class="chat-bubble-user"><span>' + nl2br(m.text) + '</span></div>';
    }
    var d = m.data || {};
    var extra = "";
    if (d.lines) extra += d.lines.map(function (l) { return '<div class="content-preview" style="margin-top:6px">' + nl2br(l) + '</div>'; }).join("");
    if (d.projectCards) extra += renderChatProjectCards(d.projectCards);
    if (d.invoiceCards) extra += renderChatInvoiceCards(d.invoiceCards);
    if (d.memoCards && d.memoCards.length) extra += renderChatMemoCards(d.memoCards);
    if (d.freeTextSummary) extra += renderChatFreeTextSummary(d.freeTextSummary);
    if (d.invoiceDraft) extra += renderChatInvoiceDraftCard(d.invoiceDraft);
    return '<div class="chat-bubble-assistant"><div class="bubble">' + nl2br(m.text) + '</div>' + extra + '</div>';
  }

  // ---------------- イベント ----------------
  function bindEvents() {
    document.querySelectorAll("[data-go]").forEach(function (el) {
      el.addEventListener("click", function () { go(el.getAttribute("data-go")); });
    });

    // 現場メモ: 入力
    var micBtn = document.getElementById("micBtn");
    if (micBtn) {
      micBtn.addEventListener("click", function () {
        toggleMic(
          function (text) {
            var ta = document.getElementById("rawInput");
            ta.value = (ta.value ? ta.value + " " : "") + text;
          },
          function (listening, msg) {
            micBtn.classList.toggle("listening", listening);
            document.getElementById("micStatus").textContent = listening ? "聞き取り中…（もう一度タップで終了）" : (msg || "タップして開始 → もう一度タップで終了");
          },
          function (interimText) {
            var status = document.getElementById("micStatus");
            if (status && isListening) status.textContent = interimText ? "認識中: " + interimText : "聞き取り中…（もう一度タップで終了）";
          }
        );
      });
    }
    var structureBtn = document.getElementById("structureBtn");
    if (structureBtn) {
      structureBtn.addEventListener("click", function () {
        var raw = document.getElementById("rawInput").value.trim();
        if (!raw) return;
        go("confirm", { pendingRaw: raw, pendingStructured: structureText(raw) });
      });
    }
    function readConfirmedCaptureFromDOM() {
      return {
        date: document.getElementById("f_date").value.trim(),
        time: document.getElementById("f_time").value.trim(),
        customer: document.getElementById("f_customer").value.trim(),
        project: document.getElementById("f_project").value.trim(),
        workLocation: document.getElementById("f_workLocation").value.trim(),
        periodStart: document.getElementById("f_periodStart").value,
        periodEnd: document.getElementById("f_periodEnd").value,
        content: document.getElementById("f_content").value.trim(),
        tasks: document.getElementById("f_tasks").value.trim(),
        projectId: state.pendingProjectSelection ? state.pendingProjectSelection.projectId : null
      };
    }
    function saveConfirmedCapture(confirmed) {
      return createCaptureRecord(state.pendingRaw, state.pendingStructured, confirmed);
    }
    var saveBtn = document.getElementById("saveBtn");
    if (saveBtn) {
      saveBtn.addEventListener("click", function () {
        saveConfirmedCapture(readConfirmedCaptureFromDOM());
        go("history");
      });
    }
    var makeQuoteBtn = document.getElementById("makeQuoteBtn");
    if (makeQuoteBtn) {
      makeQuoteBtn.addEventListener("click", function () {
        var confirmed = readConfirmedCaptureFromDOM();
        saveConfirmedCapture(confirmed);
        var sel = state.pendingProjectSelection;
        var base = defaultDocForm("quote");
        var items = confirmed.content
          ? [{ category: "", spec: confirmed.content, qty: 1, unit: "式", unitPrice: 0 }]
          : base.items;
        var remarks = base.remarks + (confirmed.tasks ? "\n・関連メモ: " + confirmed.tasks : "");

    function sendChatMessage(text) {
      if (!text || !text.trim()) return;
      chatHistory.push({ role: "user", text: text.trim() });

      var parsedQuestion = interpretQuestion(text);
      var searchIntent = parsedQuestion.searchIntents[0];
      var response;

      // 案件・顧客を特定できない質問は、案件横断の一覧・集計クエリとして処理する
      // （Query層の既存関数をそのまま呼ぶだけで、新しい検索ロジックは持たない）
      switch (parsedQuestion.queryMode) {
        case "unbilled_list":
          response = answerUnbilledProjectsList();
          break;
        case "unpaid_list":
          response = answerUnpaidInvoicesList();
          break;
        case "monthly_totals":
          response = answerMonthlyTotals(text, searchIntent.dateRange);
          break;
        case "schedule":
          response = answerSchedule(text, searchIntent.dateRange);
          break;
        case "customer_projects":
          response = answerCustomerProjects(searchIntent.customerId, searchIntent.customerName);
          break;
        default:
          if (searchIntent.projectId && /請求書/.test(text) && /(作|お願い|発行)/.test(text)) {
            response = buildInvoiceDraftResponse(searchIntent.projectId);
            break;
          }
          var searchResults = crossSearchData(searchIntent);
          if (searchResults.projects.length >= 1) {
            var snapshot = buildProjectSnapshot(searchResults.projects[0].id, searchResults);
            response = generateAnswer(text, snapshot);
            // 案件名をタップして案件詳細へ遷移できるよう、回答には必ず案件カードを添える
            if (!response.projectCards && !response.invoiceDraft) response.projectCards = [snapshot.project];
          } else if (searchIntent.projectFreeText) {
            response = answerFreeTextProject(searchIntent.projectName);
          } else {
            response = buildGeneralFallbackResponse(text, searchResults);
          }
      }

      lastInvoiceDraft = response.invoiceDraft || null;
      chatHistory.push({ role: "assistant", text: response.text, data: response });
      render();
    }
    var chatSendBtn = document.getElementById("chatSendBtn");
    if (chatSendBtn) chatSendBtn.addEventListener("click", function () {
      var input = document.getElementById("chatInput");
      var text = input.value;
      input.value = "";
      sendChatMessage(text);
    });
    var chatInput = document.getElementById("chatInput");
    if (chatInput) chatInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); document.getElementById("chatSendBtn").click(); }
    });
    var chatMicBtn = document.getElementById("chatMicBtn");
    if (chatMicBtn) chatMicBtn.addEventListener("click", function () {
      toggleMic(
        function (text) { var input = document.getElementById("chatInput"); input.value = (input.value ? input.value + " " : "") + text; },
        function (listening, msg) { chatMicBtn.classList.toggle("listening", listening); if (msg) alert(msg); },
        function () {}
      );
    });
    var chatConfirmInvoiceBtn = document.getElementById("chatConfirmInvoiceBtn");
    if (chatConfirmInvoiceBtn) chatConfirmInvoiceBtn.addEventListener("click", function () {
      if (!lastInvoiceDraft) return;
      var sel = projectSelectionInfo(lastInvoiceDraft.projectId);
      var base = defaultDocForm("invoice");
      Object.assign(base, {
        projectId: lastInvoiceDraft.projectId, customerName: sel.customerName, project: sel.projectName,
        workLocation: sel.workLocation, periodStart: sel.periodStart, periodEnd: sel.periodEnd,
        items: lastInvoiceDraft.items, selectedChangeOrderIds: lastInvoiceDraft.changeOrderIds, fromQuoteId: lastInvoiceDraft.quoteId
      });
      go("docForm", { docForm: base });
    });

    // 自社情報
    var saveCompanyBtn = document.getElementById("saveCompanyBtn");
    if (saveCompanyBtn) saveCompanyBtn.addEventListener("click", function () {
      function val(id) { return document.getElementById(id).value.trim(); }
      saveCompany({
        name: val("c_name"), zip: val("c_zip"), address: val("c_address"), tel: val("c_tel"), fax: val("c_fax"),
        invoiceRegNo: val("c_regno"), bankName: val("c_bank"), bankBranch: val("c_branch"),
        accountType: document.getElementById("c_accType").value, accountNumber: val("c_accNo"), accountHolder: val("c_accHolder")
      });
      go("home");
    });
  }

  render();
})();
</script>
</body>
</html>
